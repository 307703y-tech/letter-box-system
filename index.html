<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远方来信</title>
    <!-- 字体：常用手写/衬线/无衬线，便于多字体预览 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Patrick+Hand&family=Merriweather:wght@300;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 主界面 -->
        <div id="mainPage" class="page">
            <div class="mailbox-container">
                <h1>📮 远方来信</h1>
                <p class="subtitle">欢迎来到信件的世界</p>

                <!-- 信封预览 -->
                <div class="envelope-preview" onclick="showModal('accessModal')">
                    <div class="envelope">
                        <div class="envelope-flap"></div>
                        <div class="envelope-body">
                            <div class="stamp">✉️</div>
                        </div>
                    </div>
                    <p class="small-text">点击信封输入取信码查看信件</p>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="showModal('writeModal')">✍️ 写信 / 上传信件</button>
                    <button class="btn btn-secondary" onclick="showModal('aboutModal')">ℹ️ 关于</button>
                </div>
            </div>
        </div>

        <!-- 取信模态框 -->
        <div id="accessModal" class="modal">
            <div class="modal-content">
                <button class="close" onclick="closeModal('accessModal')">&times;</button>
                <h2>📬 取信</h2>
                <p>请输入取信码来查看信件</p>
                <input type="text" id="accessInput" placeholder="输入取信码" maxlength="20">
                <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
                    <button class="btn btn-primary" onclick="accessLetter()">查看信件</button>
                    <button class="btn" onclick="openRecentDebugInfo()">显示最近取信码（调试）</button>
                </div>
            </div>
        </div>

        <!-- 书写/上传信件模态框 -->
        <div id="writeModal" class="modal">
            <div class="modal-content large">
                <button class="close" onclick="closeModal('writeModal')">&times;</button>
                <h2>✍️ 写信 / 上传信件</h2>

                <div class="form-group">
                    <label>寄信人名字</label>
                    <input type="text" id="senderName" placeholder="请输入你的名字" maxlength="50">
                </div>

                <div class="form-group">
                    <label>收信人名字</label>
                    <input type="text" id="recipientName" placeholder="请输入收信人名字" maxlength="50">
                </div>

                <div class="form-group">
                    <label>信件内容（文字 或 使用手写/上传图片）</label>
                    <div class="content-tabs">
                        <button class="tab-btn active" onclick="switchTab('textInput', event)">📝 文字</button>
                        <button class="tab-btn" onclick="switchTab('handwriteInput', event)">✏️ 手写 / 上传</button>
                    </div>

                    <div id="textInput" class="tab-content active">
                        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
                            <label class="tool-label">字体
                                <select id="textFont">
                                    <option value="Roboto, sans-serif">Roboto（无衬线）</option>
                                    <option value="Merriweather, serif">Merriweather（衬线）</option>
                                    <option value="Patrick Hand, cursive">Patrick Hand（手写风）</option>
                                    <option value="Dancing Script, cursive">Dancing Script（手写装饰）</option>
                                </select>
                            </label>
                            <label class="tool-label">字号 <input type="number" id="textSize" value="16" min="12" max="36" style="width:70px"></label>
                        </div>
                        <textarea id="letterContent" placeholder="请输入信件内容..." rows="8" style="font-family:inherit"></textarea>
                    </div>

                    <div id="handwriteInput" class="tab-content">
                        <div class="tool-bar">
                            <button class="tool-btn active" id="penBtn" onclick="setTool('pen')">铅笔</button>
                            <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')">橡皮擦</button>
                            <label class="tool-label">颜色 <input type="color" id="penColor" value="#333333" onchange="setColor(this.value)"></label>
                            <label class="tool-label">粗细 <input type="range" id="penSize" min="1" max="30" value="2" onchange="setSize(this.value)"></label>
                            <button class="btn btn-small" onclick="undoCanvas()">撤销</button>
                            <button class="btn btn-small" onclick="clearCanvas()">清除</button>
                            <button class="btn btn-small" onclick="toggleCanvasFullscreen()">放大书写区域</button>
                        </div>

                        <div class="handwrite-area">
                            <canvas id="handwriteCanvas" width="900" height="500"></canvas>
                        </div>

                        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
                            <button class="btn btn-primary" onclick="useHandwritingAsContent()">将手写插入到信纸（作为图片）</button>
                            <label class="tool-label">或上传纸质信件： <input type="file" id="uploadPaper" accept="image/*" onchange="handleUploadPaper(event)"></label>
                        </div>

                        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
                            <label class="tool-label">纸张样式
                                <select id="paperStyle">
                                    <option value="default">默认</option>
                                    <option value="lined">横线</option>
                                    <option value="grid">方格</option>
                                    <option value="kraft">牛皮纸</option>
                                </select>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>设置取信码（用户自定义）</label>
                    <input type="text" id="writeAccessCode" placeholder="请设置一个取信码（字母数字，不超过20位）" maxlength="20">
                    <p class="small-text">* 此码用于他人查看你的信件</p>
                </div>

                <button class="btn btn-primary" onclick="submitLetter()">📮 发送信件</button>
            </div>
        </div>

        <!-- 信件显示模态框（含信封/点击开封） -->
        <div id="letterModal" class="modal">
            <div class="modal-content large letter-modal-content">
                <button class="close" onclick="closeModal('letterModal')">&times;</button>

                <div class="envelope-container" id="envelopeContainer">
                    <div class="envelope-view" id="envelopeView">
                        <div class="envelope-cover" id="envelopeCover" onclick="openEnvelope()">
                            <div class="wax">✺</div>
                        </div>
                        <div class="paper" id="paperContent">
                            <div class="paper-inner" id="paperInner">
                                <div class="letter-header">
                                    <h2 id="displayHeader">远方来信</h2>
                                    <p class="letter-info">寄自：<span id="displaySender"></span></p>
                                    <p class="letter-info">寄给：<span id="displayRecipient"></span></p>
                                    <p class="letter-info">时间：<span id="displayDate"></span></p>
                                </div>
                                <div class="letter-content" id="displayContent">
                                    <!-- 文字或图片内容 -->
                                </div>
                                <div class="place-controls" id="placeControls" style="display:none; margin-top:8px; gap:8px; align-items:center;">
                                    <label class="tool-label">图像宽度 <input type="range" id="placedSize" min="10" max="100" value="60" onchange="resizePlaced(this.value)"></label>
                                    <button class="btn" onclick="removePlaced()">移除手写/图片</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="unlock-area">
                        <div class="slider" id="openSlider" style="display:none">
                            <div class="slider-handle" id="sliderHandle">⮕</div>
                            <div class="slider-label">滑动解封（或点击封面）</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 关于模态框 -->
        <div id="aboutModal" class="modal">
            <div class="modal-content">
                <button class="close" onclick="closeModal('aboutModal')">&times;</button>
                <h2>ℹ️ 关于远方来信</h2>
                <p>这是一个虚拟信箱系统，让你能够：</p>
                <ul>
                    <li>✍️ 手写或输入信件内容</li>
                    <li>🔐 设置专属的取信码</li>
                    <li>📬 分享取信码给他人</li>
                    <li>📖 阅读他人寄给你的信件</li>
                </ul>
                <p>所有信件存储在浏览器本地，确保隐私安全。</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
